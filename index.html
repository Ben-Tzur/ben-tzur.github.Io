<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הלהיטים של בן צור</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:   #FFFFFF;
      --bg:      #F7F7F5;
      --surface: #FFFFFF;
      --fg:      #111110;
      --muted:   #888884;
      --border:  #E8E8E4;
      --accent:  #1A1A18;
      --red:     #D63B2F;
      --hover:   #F3F3F0;
      --play-bg: #111110;
      --radius:  16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== LAYOUT ====== */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    /* ====== HERO CARD ====== */
    .hero-card {
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 2.5rem;
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .album-art-wrap {
      flex-shrink: 0;
      width: 220px;
    }

    .album-art {
      width: 220px;
      height: 220px;
      border-radius: 18px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }

    .album-art-placeholder {
      width: 220px;
      height: 220px;
      border-radius: 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
    }

    .hero-top { }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      background: #FDF0EF;
      border: 1px solid #FACEC9;
      border-radius: 100px;
      padding: 5px 14px;
      margin-bottom: 1.2rem;
    }

    .hero-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }

    .hero-title {
      font-family: 'Heebo', sans-serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 5vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    .hero-artist {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 0;
    }

    .hero-bottom { }

    .hero-stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .stat { }

    .stat-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--fg);
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .hero-actions {
      display: flex;
      gap: 0.75rem;
    }

    /* ====== BUTTONS ====== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Heebo', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 100px;
      padding: 10px 22px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--fg);
      color: white;
    }
    .btn-primary:hover { background: #333; }

    .btn-ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--hover); }

    .btn svg { flex-shrink: 0; }

    /* ====== SECTION HEADER ====== */
    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .track-count {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ====== TRACKLIST ====== */
    .tracklist-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .track-header-row {
      display: grid;
      grid-template-columns: 52px 1fr 100px 120px 44px;
      gap: 0 1rem;
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .th {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    /* ====== TRACK ROW ====== */
    .track-row {
      animation: rise 0.35s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .track-row:not(:last-child) .track-inner {
      border-bottom: 1px solid var(--border);
    }

    .track-inner {
      display: grid;
      grid-template-columns: 52px 1fr 100px 120px 44px;
      align-items: center;
      gap: 0 1rem;
      padding: 0.85rem 1.25rem;
      cursor: pointer;
      transition: background 0.12s;
    }

    .track-inner:hover { background: var(--hover); }
    .track-row.playing .track-inner { background: #F0F8FF; }

    .track-num-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .bars-icon {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .bar {
      width: 3px;
      background: #1A73E8;
      border-radius: 2px;
      animation: bar-bounce 0.65s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 14px; animation-delay: 0.18s; }
    .bar:nth-child(3) { height: 10px; animation-delay: 0.09s; }

    @keyframes bar-bounce {
      from { transform: scaleY(0.3); }
      to   { transform: scaleY(1); }
    }

    .track-main { display: flex; align-items: center; gap: 14px; overflow: hidden; }

    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .track-info { overflow: hidden; }

    .track-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s;
    }

    .track-row.playing .track-name { color: #1A73E8; }

    .track-name-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-dur {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* progress column */
    .track-prog-wrap {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
    }

    .track-prog {
      width: 100%;
      height: 3px;
      background: #E8E8E4;
      border-radius: 100px;
      cursor: pointer;
      overflow: visible;
      position: relative;
    }

    .track-prog-fill {
      height: 100%;
      background: #1A73E8;
      border-radius: 100px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .track-prog-empty {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 100px;
    }

    /* play button */
    .track-play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--fg);
      flex-shrink: 0;
    }

    .track-play-btn:hover {
      background: var(--fg);
      color: white;
      border-color: var(--fg);
    }

    .track-row.playing .track-play-btn {
      background: #1A73E8;
      color: white;
      border-color: #1A73E8;
    }

    /* download button */
    .track-dl-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--muted);
      text-decoration: none;
      flex-shrink: 0;
    }

    .track-dl-btn:hover {
      background: var(--fg);
      color: white;
      border-color: var(--fg);
    }

    /* ====== LOADING ====== */
    #loading {
      padding: 4rem 0;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .spin {
      display: block;
      margin: 0 auto 1rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ====== ERROR ====== */
    #error-msg {
      padding: 1.5rem;
      color: var(--red);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      border: 1px solid #FACEC9;
      border-radius: 12px;
      background: #FDF0EF;
      display: none;
      margin-top: 1rem;
    }

    /* ====== FOOTER ====== */
    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 700px) {
      .page { padding: 1.5rem 1rem 4rem; }

      .hero-card {
        flex-direction: column;
        gap: 1.5rem;
        padding: 1.5rem;
      }

      .album-art-wrap { width: 100%; }
      .album-art, .album-art-placeholder {
        width: 100%;
        height: 220px;
      }

      .hero-meta { min-height: unset; }

      .track-header-row,
      .track-inner {
        grid-template-columns: 36px 1fr 44px;
      }

      .th:nth-child(3), .th:nth-child(4),
      .track-dur, .track-prog-wrap { display: none; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- HERO -->
  <div class="hero-card">
    <div class="album-art-wrap">
      <img
        id="main-album-art"
        src="https://www.prog.co.il/attachments/1779620094443-png.2252968/?hash=a4f7499190adf18fce28d82c032a559d"
        alt="בן צור"
        class="album-art"
        onerror="this.outerHTML='<div class=\'album-art-placeholder\'><svg width=\'48\' height=\'48\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#ccc\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><circle cx=\'12\' cy=\'10\' r=\'3\'/><path d=\'M6.2 19.4a6 6 0 0111.6 0\'/></svg></div>'"
      />
    </div>
    <div class="hero-meta">
      <div class="hero-top">
        <div class="hero-tag">האוסף המלא</div>
        <h1 class="hero-title">הלהיטים של<br>בן צור</h1>
        <p class="hero-artist">אוסף הרשמי &mdash; unofficial mixtape</p>
      </div>
      <div class="hero-bottom">
        <div class="hero-stats">
          <div class="stat">
            <div class="stat-num" id="total-tracks">–</div>
            <div class="stat-label">שירים</div>
          </div>
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" id="play-all-btn" onclick="playAll()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 1.5l10 5.5-10 5.5V1.5z"/></svg>
            נגן הכל
          </button>
          <button class="btn btn-ghost" id="shuffle-btn" onclick="shufflePlay()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            </svg>
            ערבב
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TRACKLIST -->
  <div class="section-hdr">
    <span class="section-title">רשימת שירים</span>
    <span class="track-count" id="count-label"></span>
  </div>

  <div class="tracklist-card">
    <div class="track-header-row">
      <span class="th" style="text-align:center">#</span>
      <span class="th">שיר</span>
      <span class="th" style="text-align:center">מד</span>
      <span class="th">התקדמות</span>
      <span class="th"></span>
    </div>

    <div id="loading">
      <svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.18"/>
        <path d="M12 2a10 10 0 0110 10" stroke-linecap="round"/>
      </svg>
      טוען שירים...
    </div>

    <div id="error-msg"><span id="error-text"></span></div>
    <div id="tracklist"></div>
  </div>

  <footer>לשימוש אישי בלבד &bull; unofficial &bull; all rights reserved</footer>
</div>

<script>
  const PLAY_ICON  = `<svg width="13" height="14" viewBox="0 0 13 14" fill="currentColor"><path d="M1 1.5l11 5.5-11 5.5V1.5z"/></svg>`;
  const PAUSE_ICON = `<svg width="13" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="0" width="4" height="14" rx="1.5"/><rect x="9" y="0" width="4" height="14" rx="1.5"/></svg>`;
  const BARS_HTML  = `<div class="bars-icon"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;
  const DL_ICON    = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

  let curAudio = null, curRow = null, curIdx = -1;
  let allRows = [], allAudios = [], allSongs = [];

  const fmt = s => isNaN(s) ? '--:--' : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

  function parse(raw) {
    return raw.trim().split(/\n[ \t]*\n/).reduce((a, blk) => {
      const ls = blk.trim().split('\n').map(l => l.trim()).filter(Boolean);
      if (ls.length >= 3) a.push({ name: ls[0], img: ls[1], audio: ls[2] });
      return a;
    }, []);
  }

  const BLANK = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23EBEBEB' rx='8'/></svg>`;

  function stopCurrent() {
    if (!curAudio) return;
    curAudio.pause();
    if (curRow) {
      const i = parseInt(curRow.dataset.idx);
      curRow.classList.remove('playing');
      curRow.querySelector('.track-play-btn').innerHTML = PLAY_ICON;
      const n = curRow.querySelector('.track-num');
      n.innerHTML = String(i+1).padStart(2,'0');
      curRow.querySelector('.track-prog-fill').style.width = '0%';
      const dur = curRow.querySelector('.track-dur');
      if (dur) dur.textContent = curAudio.duration ? fmt(curAudio.duration) : '--:--';
    }
  }

  function playRow(idx) {
    stopCurrent();
    const row = allRows[idx];
    const audio = allAudios[idx];
    if (!row || !audio) return;

    audio.play().catch(() => {});
    curAudio = audio;
    curRow = row;
    curIdx = idx;

    row.classList.add('playing');
    row.querySelector('.track-play-btn').innerHTML = PAUSE_ICON;
    const n = row.querySelector('.track-num');
    n.innerHTML = BARS_HTML;

    // update hero art
    const heroArt = document.getElementById('main-album-art');
    if (heroArt) {
      heroArt.src = allSongs[idx].img;
      heroArt.onerror = () => { heroArt.src = BLANK; };
    }
  }

  function playAll() { if (allRows.length) playRow(0); }

  function shufflePlay() {
    if (!allRows.length) return;
    const idx = Math.floor(Math.random() * allRows.length);
    playRow(idx);
  }

  function makeRow(song, idx) {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.idx = idx;
    row.style.animationDelay = `${idx * 0.04}s`;

    row.innerHTML = `
      <div class="track-inner">
        <div class="track-num-wrap">
          <span class="track-num">${String(idx+1).padStart(2,'0')}</span>
        </div>
        <div class="track-main">
          <img class="track-thumb" src="${song.img}" alt="${song.name}" loading="lazy">
          <div class="track-info">
            <div class="track-name">${song.name}</div>
            <div class="track-name-sub">בן צור</div>
          </div>
        </div>
        <div class="track-dur">--:--</div>
        <div class="track-prog-wrap">
          <div class="track-prog"><div class="track-prog-fill"></div></div>
        </div>
        <button class="track-play-btn" aria-label="נגן את ${song.name}">${PLAY_ICON}</button>
      </div>`;

    const audio = new Audio(song.audio);
    audio.preload = 'metadata';
    allAudios[idx] = audio;

    const img     = row.querySelector('.track-thumb');
    const btn     = row.querySelector('.track-play-btn');
    const inner   = row.querySelector('.track-inner');
    const prog    = row.querySelector('.track-prog');
    const fill    = row.querySelector('.track-prog-fill');
    const durEl   = row.querySelector('.track-dur');

    img.onerror = () => { img.src = BLANK; };

    audio.addEventListener('loadedmetadata', () => {
      durEl.textContent = fmt(audio.duration);
    });

    inner.addEventListener('click', () => {
      if (curAudio === audio && !audio.paused) {
        stopCurrent();
      } else if (curAudio === audio && audio.paused) {
        audio.play().catch(() => {});
        row.classList.add('playing');
        btn.innerHTML = PAUSE_ICON;
        row.querySelector('.track-num').innerHTML = BARS_HTML;
      } else {
        playRow(idx);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        durEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      stopCurrent();
      audio.currentTime = 0;
      durEl.textContent = fmt(audio.duration);
      // autoplay next
      if (idx + 1 < allRows.length) playRow(idx + 1);
    });

    prog.addEventListener('click', e => {
      if (!audio.duration) return;
      const r = prog.getBoundingClientRect();
      // RTL: right edge is start
      const ratio = 1 - ((e.clientX - r.left) / r.width);
      audio.currentTime = ratio * audio.duration;
      e.stopPropagation();
    });

    return row;
  }

  async function init() {
    const loadEl = document.getElementById('loading');
    const errEl  = document.getElementById('error-msg');
    const errTxt = document.getElementById('error-text');
    const list   = document.getElementById('tracklist');

    try {
      const res  = await fetch('./להיטים.txt');
      if (!res.ok) throw new Error(`להיטים.txt לא נמצא (HTTP ${res.status})`);
      const songs = parse(await res.text());
      if (!songs.length) throw new Error('הקובץ ריק או לא בפורמט הנכון');

      allSongs = songs;
      loadEl.style.display = 'none';

      document.getElementById('total-tracks').textContent = songs.length;
      document.getElementById('count-label').textContent = `${songs.length} שירים`;

      songs.forEach((s, i) => {
        const row = makeRow(s, i);
        allRows[i] = row;
        list.appendChild(row);
      });

      // add download buttons after rows exist
      songs.forEach((s, i) => {
        const row = allRows[i];
        const inner = row.querySelector('.track-inner');
        const dlBtn = document.createElement('a');
        dlBtn.className = 'track-dl-btn';
        dlBtn.href = s.audio;
        dlBtn.download = s.name + '.mp3';
        dlBtn.setAttribute('aria-label', 'הורד את ' + s.name);
        dlBtn.innerHTML = DL_ICON;
        dlBtn.addEventListener('click', e => e.stopPropagation());
        // insert before play button
        const playBtn = inner.querySelector('.track-play-btn');
        inner.insertBefore(dlBtn, playBtn);
      });

    } catch (e) {
      loadEl.style.display = 'none';
      errTxt.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  init();
</script>
</body>
</html>
